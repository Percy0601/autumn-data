# 使用方视角：只配数据源，其余全部走约定
spring.datasource.url=jdbc:h2:mem:autumn-using-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
# 显式指定，避免与主资源脚本被通配重复加载
spring.sql.init.schema-locations=classpath:test-schema.sql
spring.sql.init.data-locations=classpath:test-data.sql
# autumn 约定项均可省略；此处展示显式覆盖写法（与自动识别结果一致）
autumn.data.jdbc.dialect=h2
# 动态层三类产物落在 target 下的固定子目录，避免污染源码目录
autumn.data.meta.mapper.meta-directory=target/autumn-meta
