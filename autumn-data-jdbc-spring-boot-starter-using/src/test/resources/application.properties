# 使用方视角：只配数据源，其余全部走约定
spring.datasource.url=jdbc:h2:mem:autumn-using-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
# 显式指定测试脚本（不加载主资源里的脚本）
spring.sql.init.schema-locations=classpath:test-schema.sql
spring.sql.init.data-locations=classpath:test-data.sql
# autumn 约定项均可省略；此处展示显式覆盖写法（与自动识别结果一致）
autumn.data.jdbc.dialect=h2
# 动态层产物落在 target 下，避免污染源码目录：
#   spec/xml/   使用方手写语句（框架只读）
#   auto/xml/   框架生成的七条默认语句
#   auto/entity/ 框架生成的实体源码
# classpath 手写 SQL 兜底路径：meta-data/{数据源}-default/{命名空间}-default/spec/xml/{表名}.xml
autumn.data.meta.mapper.meta-directory=target/autumn-meta
