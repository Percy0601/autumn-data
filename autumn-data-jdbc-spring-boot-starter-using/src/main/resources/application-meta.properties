# 多数据源接管演示配置（配合 --spring.profiles.active=demo,meta 使用）
# 打开后 SpringMetaDataSource（AbstractDataSource 子类）成为应用唯一的 DataSource，
# spring.datasource.* 仍是默认池的参数来源，Boot 自己的建池自动退让。
autumn.data.meta.enabled=true
# 默认池在 MetaDataSource 注册表里的名字：无参 getConnection() 与 @Transactional 都绑它
autumn.data.meta.default-pool-name=primary
# 空闲池轮询回收间隔（多池模式下才真正轮询），留空则用 MetaDataSource 内置的 3 分钟
autumn.data.meta.sweep-interval=2m
# 配置声明的额外数据源：首次访问才建池，更多调优写 autumn.data.meta.pools.report.hikari.*
autumn.data.meta.pools.report.url=jdbc:h2:tcp://localhost:9092/autumn_report;MODE=MySQL
autumn.data.meta.pools.report.username=sa
autumn.data.meta.pools.report.password=123456
# 取某个池自己开事务/跑迁移时：metaDataSource.pool("report") 拿到真实 DataSource
