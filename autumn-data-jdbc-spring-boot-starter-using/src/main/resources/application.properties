# 使用方示例主应用配置 —— 仅 --demo profile 生效（与测试配置隔离）
# 启动前需注入密码：export H2_PASSWORD=xxx
# 启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:tcp://localhost:9092/autumn_security;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123456
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:main-schema.sql
server.port=8080

# autumn 方言：H2 服务即便跑 MODE=MySQL，元数据产品名仍是 H2，自动识别得到 H2Dialect。
# 若想让分页/引用按 MySQL 语法生成，显式指定：autumn.data.jdbc.dialect=mysql

# 动态层（MetaDataController）的产物统一落到 target，不污染源码目录：
#   target/autumn-meta/meta-class/  元类定义 JSON
#   target/autumn-meta/entity/      运行期生成的表实体 .java
#   target/autumn-meta/vo/          运行期生成的查询结果 VO（MetaClass 子类）.java
#   target/autumn-meta/sql/         语句 XML（实体 表名.xml / VO 表名.vo.xml，按 数据源/命名空间 分层）
autumn.data.meta.mapper.meta-directory=target/autumn-meta
