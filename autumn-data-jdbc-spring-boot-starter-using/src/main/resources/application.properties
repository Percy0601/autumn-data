# 使用方示例主应用配置：MetaDataController 在运行时自行建/删演示表，无需初始化脚本
# 启动方式：mvn spring-boot:run
spring.datasource.url=jdbc:h2:mem:autumn-using;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
server.port=8080

# autumn 方言：H2 内存库默认自动识别为 H2Dialect。
# 若想让分页/引用按 MySQL 语法生成，显式指定：autumn.data.jdbc.dialect=mysql

# 动态层产物落在 target 下，避免污染源码目录：
#   spec/xml/     使用方手写语句（框架只读、绝不覆盖）
#   auto/xml/     框架生成的七条默认语句
#   auto/entity/  框架生成的实体源码
# classpath 手写 SQL 兜底路径：meta-data/{数据源}-default/{命名空间}-default/spec/xml/{表名}.xml
autumn.data.meta.mapper.meta-directory=target/autumn-meta
